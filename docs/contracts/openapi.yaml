openapi: 3.0.3

info:
  title: Pet-dog 桌宠控制台 API
  version: 2.0.0
  description: |
    STM32 智能桌面宠物的前后端接口契约 v2.0（PET-API-V2.0）。

    本文件是**唯一**机器可读契约；人读版 `docs/contracts/http-api.md`，
    串口帧 `docs/contracts/frame.md`，WS 事件 `docs/contracts/events.md`，
    错误码 `docs/contracts/error-codes.md`，超时表 `docs/contracts/action-timing.md`。
    五份文件同属 `docs/contracts/`，是本项目的唯一真源。

    v2.0 = V1.1（前端反向导出）+ V1.0（docs/contracts 原稿）合并结果，取舍见 http-api.md 变更记录。

    ## 三条必须遵守的约定

    1. 所有 HTTP 接口都在 `/api` 前缀下，统一返回 `{code, message, data, timestamp}`，
       `code = 0` 表示成功。
    2. 业务失败用 HTTP 200 + 非 0 `code`（前端直接弹 `message`）；
       只有登录态失效才用 HTTP 401 + `code: 40101`（前端据此清登录态跳登录页）。
    3. `POST /api/commands/send` 必须立即返回（<300ms），不能等设备应答；
       设备应答通过 WebSocket 的 `ack` 事件回推，且必须晚于 HTTP 响应。
    4. 命令是有生命周期的实体，主键是 `cmd_id`（UUID，后端生成，受理即返回）。
       `seq` 只是串口序号（1-255 循环），供日志排查与 WS `ack` 配对，
       **前端不得用 `seq` 做命令主键**。
    5. **所有 JSON 字段名、查询参数名统一 snake_case**（`device_id`、`updated_at`、
       `music_state`）。HTTP 路径里的占位符写 `{id}`，不写 `{device_id}`。

    ## WebSocket

    先换一次性票据，再建连（**不要把 JWT 放进 URL**）：

    1. `POST /api/events/ticket`，带 `Authorization: Bearer <token>`，body `{"device_id": 1}`
       → `data: {"ticket": "...", "expires_in_sec": 30}`
    2. `ws://127.0.0.1:8000/ws/device?device_id=1&ticket=<ticket>`

    票据 30 秒有效、只能用一次、绑定 (user_id, device_id)，用完即焚；重连必须重新换票。

    服务端单向推送纯文本 JSON 帧，一条消息一个事件，扁平信封 `{event, data}`：

    ```json
    {"event": "state",   "data": {"battery": 78, "voltage": 3.92, "action": 51,
                                  "face": 0, "music_state": 0, "track": 3,
                                  "weather_code": 0, "temp": 23}}
    {"event": "ack",     "data": {"seq": 17, "status": "OK", "cost_ms": 312,
                                  "cmd_id": "6f1f2c1e-8d1a-4c3b-9e77-0a1b2c3d4e5f"}}
    {"event": "link",    "data": {"online": true}}
    {"event": "music",   "data": {"state": 1, "track": 3, "volume": 15}}
    {"event": "weather", "data": {"code": 0, "text": "晴", "temp": 23}}
    ```

    只有这五种事件，没有其它。`ack` 是**弱确认**：`status` 只有 `OK` / `ERROR` 两值，
    表示串口帧是否被受理，不代表动作执行完成；动作的最终结果看 `command_log` 四态
    （`PENDING` → `OK` / `TIMEOUT` / `ERROR`）。
    `cmd_id` 是后端推回来的命令主键，前端可以不读；需要断线对账时用它查
    `GET /api/commands/{id}`。

    关闭码：`1000` 正常、`4001` 缺参或格式错、`4003` 票据无效/过期/已用、
    `4009` 同用户同设备连接超限（上限 3）、`1011` 服务端错误。
    前端不会给服务端发任何消息，也没有客户端心跳。

    ## 业务错误怎么读

    业务失败是 HTTP **200** + 非 0 `code`，不是 4xx。所以本文件每个操作只把 HTTP 层的
    `401` 列成具名响应，其余业务错误放在 `x-business-errors` 扩展里（`default` 指向
    通用错误体）。完整错误码表见契约文档第 7 章。

    `message` 是给用户看的中文，前端原样弹出，不要写英文堆栈。

servers:
  - url: http://127.0.0.1:8000
    description: 本地后端（前端 dev 时经 Vite 代理 /api 与 /ws）

tags:
  - name: 系统
  - name: 认证
  - name: 设备
  - name: 指令
  - name: 表情
  - name: 日志与遥测
  - name: 场景

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [系统]
      summary: 健康检查
      description: 前端不调用，联调自检用。
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, description: 固定 ok，进程活着就返回它, example: ok }
                          mode: { type: string, description: serial = 真串口；mock = 内存假数据, example: serial }
                          version: { type: string, description: 后端版本号，与 /docs 头部一致, example: 2.0.0 }
              example:
                code: 0
                message: ok
                data: { status: ok, mode: serial, version: 2.0.0 }
                timestamp: 1762587000000

  /api/auth/login:
    post:
      tags: [认证]
      summary: 登录换取 token
      description: 前端：`src/api/auth.ts → login()`。密码错返回 HTTP 200 + code 40001。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: '123456', format: password }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
              example:
                code: 0
                message: ok
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                  user: { username: admin, name: 管理员, role: admin }
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40001, message: 用户名或密码错误 }

  /api/auth/register:
    post:
      tags: [认证]
      summary: 注册账号
      description: |
        前端：`src/api/auth.ts → register()`，登录页「注册」。
        只建账号，不签发 token；前端注册成功后切回登录页，用新账号登录。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RegisterResult' }
              example:
                code: 0
                message: ok
                data: { username: tester01, name: tester01 }
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40002, message: 用户名需 3–20 位字母、数字、下划线或中文 }
          - { code: 40002, message: 密码至少 6 位 }
          - { code: 40900, message: 用户名已存在 }

  /api/auth/me:
    get:
      tags: [认证]
      summary: 当前登录用户
      description: 前端：`src/api/auth.ts → fetchMe()`。
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
              example:
                code: 0
                message: ok
                data: { username: admin, name: 管理员, role: admin }
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/devices:
    get:
      tags: [设备]
      summary: 设备列表
      description: |
        前端：`src/api/device.ts → listDevices()`。
        直接返回数组，不是分页对象。必须至少含一台 id=1 的设备（前端默认选它）。
      responses:
        '200':
          description: 设备数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Device' }
              example:
                code: 0
                message: ok
                data:
                  - id: 1
                    name: 桌宠一号 · 小灰
                    online: true
                    firmware: v2.0.0
                    last_heartbeat: '2026-11-08T15:29:52+08:00'
                    battery: 78
                    location: 书桌
                  - id: 2
                    name: 桌宠二号 · 小白
                    online: false
                    firmware: v1.9.3
                    last_heartbeat: '2026-11-08T13:30:00+08:00'
                    battery: 41
                    location: 客厅
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/devices/{id}:
    get:
      tags: [设备]
      summary: 单台设备
      description: 前端：`src/api/device.ts → getDevice()`。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 设备
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Device' }
              example:
                code: 0
                message: ok
                data:
                  id: 1
                  name: 桌宠一号 · 小灰
                  online: true
                  firmware: v2.0.0
                  last_heartbeat: '2026-11-08T15:29:52+08:00'
                  battery: 78
                  location: 书桌
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [设备]
      summary: 修改桌宠名字
      description: |
        前端：`src/api/device.ts → renameDevice()`，设备页名字后的铅笔按钮。
        只改显示名，不动连接参数；返回修改后的完整 Device。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRename' }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Device' }
              example:
                code: 0
                message: ok
                data:
                  id: 1
                  name: 小灰灰
                  online: true
                  firmware: v2.0.0
                  last_heartbeat: '2026-11-08T15:29:52+08:00'
                  battery: 78
                  location: 书桌
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        x-business-errors:
          - { code: 40002, message: 名字需要 1–20 个字符 }
          - { code: 40400, message: 设备不存在 }

  /api/devices/{id}/status:
    get:
      tags: [设备]
      summary: 设备状态快照
      description: |
        前端：`src/api/device.ts → getDeviceStatus()`，进监控台时拉一次，之后靠 WS `state` 增量更新。
        必须返回后端缓存的实时值（来源：设备每 5 秒上报的 0x03），不要在请求里同步查串口。
        11 个字段一个都不能少，前端直接赋给 store 渲染。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 状态快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DeviceStatus' }
              example:
                code: 0
                message: ok
                data:
                  device_id: 1
                  battery: 78
                  voltage: 3.92
                  action: 49
                  face: 0
                  music_state: 0
                  track: 3
                  volume: 15
                  weather_code: 0
                  temp: 23
                  updated_at: '2026-11-08T15:30:00+08:00'
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/devices/{id}/music:
    post:
      tags: [设备]
      summary: 音乐控制
      description: |
        前端：`src/api/music.ts → sendMusic()`。响应体前端不读，但执行完必须推 WS `music` 事件，
        否则音量条和播放状态不会更新。曲目号需自行回绕，避免 0 或超出曲库。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MusicRequest' }
      responses:
        '200':
          description: 已下发
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MusicResult' }
              example:
                code: 0
                message: ok
                data: { ok: true, state: 1, track: 3, volume: 20 }
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/commands/send:
    post:
      tags: [指令]
      summary: 下发一个动作
      description: |
        前端：`src/api/command.ts → sendCommand()`，监控台 19 个动作按钮与场景执行都走这里。

        ### 时序硬要求（最容易翻车的一处）
        - **立即返回**（<300ms）：落库后立刻返回 `cmd_id` + `seq`，不等设备应答，
          更不等动作跑完。设备应答由 WS `ack` 异步回推。
        - 必须**先返回 HTTP 响应，再推 WS `ack`**：前端在 `await sendCommand()` 之后才把
          `pending[seq]` 登记上，ack 早到会被当成迟到消息丢弃，按钮会误标红。
          后端实现上就是 `await asyncio.sleep(0.05)` 之后再推第一帧。
        - `seq` 在 **1-255** 循环（0 保留），同一时刻不能有两帧用同一个 seq。
          前端用 seq 做 ack 配对键，但命令主键始终是 `cmd_id`。

        ### 其它
        - 没有 `device_id` 字段是故意的：单串口链路，后端按当前唯一设备（id=1）处理。
        - 设备离线**不拒绝**请求，照常受理（离线命令最终落 `TIMEOUT`）。
          提前拒绝会丢掉一次本来可能成功的执行。
        - 无论设备是否应答，都要写 `command_log`：受理时 `PENDING`，之后更新为
          `OK` / `TIMEOUT`（`T_ACK_MS` = 600ms 没等到 0x81 受理）/ `ERROR`（收到 0x05 或写串口失败）。
        - `cmd_id` 由后端生成并在响应里返回；前端把它存进 pending 表，
          断线重连后用它查 `GET /api/commands/{id}` 对账。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CommandAccepted' }
              example:
                code: 0
                message: ok
                data:
                  cmd_id: 6f1f2c1e-8d1a-4c3b-9e77-0a1b2c3d4e5f
                  seq: 17
                  action: 51
                  accepted: true
                  status: pending
                  transport: ok
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40002, message: 业务校验失败，message 直接展示给用户 }
          - { code: 50000, message: 串口写入失败，命令未下发 }
          - { code: 40400, message: 设备不存在（库里没有 id=1 的记录） }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/commands/{id}:
    get:
      tags: [指令]
      summary: 按 cmd_id 查单条命令状态（断线对账用）
      description: |
        前端：断线重连后（先按 events.md §7 拉一次设备 status），对本地仍为 pending 的命令
        **各查一次**，把丢失的终态补回来。只补本地有记录的，不轮询，最多 20 条。

        不存在时返回 `code: 40400` 且 `data: null`，不是 HTTP 404。
        注意：这里**不回放历史事件**，只给你当前状态——事件丢了自己补终态，
        这是 events.md §0「丢线之后靠 HTTP 重建，不靠补发」的直接推论。
      parameters:
        - name: id
          in: path
          required: true
          description: 命令主键（UUID），由 POST /api/commands/send 返回
          schema: { type: string, format: uuid, example: 6f1f2c1e-8d1a-4c3b-9e77-0a1b2c3d4e5f }
      responses:
        '200':
          description: 命令回执，或 code=40400 + data=null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/CommandReceipt'
                        nullable: true
              example:
                code: 0
                message: ok
                data:
                  cmd_id: 6f1f2c1e-8d1a-4c3b-9e77-0a1b2c3d4e5f
                  device_id: 1
                  action: 51
                  seq: 17
                  status: done
                  transport: ok
                  error_code: null
                  created_at: '2026-11-08T15:29:41+08:00'
                  updated_at: '2026-11-08T15:29:42.312+08:00'
                  finished_at: '2026-11-08T15:29:42.312+08:00'
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40400, message: 命令不存在，data 为 null }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events/ticket:
    post:
      tags: [系统]
      summary: 换取 WebSocket 一次性票据
      description: |
        ## 为什么需要它
        浏览器的 `new WebSocket()` **不能**设置自定义请求头，所以没法带 `Authorization: Bearer`。
        把长期 JWT 放进 URL 查询参数（`/ws/device?token=<JWT>`）会进 access log、
        代理日志、浏览器历史——等于长期凭证泄漏。

        改为：先用带 Bearer 头的 HTTP 请求换一张 30 秒有效、一次性、绑定 (user_id, device_id)
        的票据，再用 `/ws/device?device_id=1&ticket=<ticket>` 建连。票据验过即删，
        重连必须重新换票。

        ## 票据规则
        - 有效期 30 秒，使用次数 1 次
        - 绑定 (user_id, device_id)，换票的设备和建连的设备必须一致
        - 存内存 `dict[ticket] -> (user_id, device_id, expireAt)`，每次签发顺手扫一遍过期项
        - 进程重启后全部失效（不落库）
        - 服务端必须单进程跑（与串口唯一所有者同一个约束）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: integer, example: 1 }
      responses:
        '200':
          description: data = WsTicket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WsTicket' }
              example:
                code: 0
                message: ok
                data: { ticket: 3f7c9a2e5b1d4c8f, expires_in_sec: 30 }
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40300, message: 没有该设备的访问权 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/faces:
    get:
      tags: [表情]
      summary: 表情列表
      description: |
        前端：`src/api/face.ts → listFaces()`。id 0-6 为内置（与固件编号一致），自定义从 100 起。
        内置表情前端自己画 SVG，`preview` 会被忽略。
      responses:
        '200':
          description: 表情数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/FaceItem' }
              example:
                code: 0
                message: ok
                data:
                  - { id: 0, name: 普通, builtin: true }
                  - { id: 1, name: 开心, builtin: true }
                  - { id: 2, name: 困倦, builtin: true }
                  - { id: 3, name: 生气, builtin: true }
                  - { id: 4, name: 惊讶, builtin: true }
                  - { id: 5, name: 伤心, builtin: true }
                  - { id: 6, name: 卖萌, builtin: true }
                  - { id: 101, name: 我的狗, builtin: false, preview: /api/faces/101/preview }
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [表情]
      summary: 上传自定义表情
      description: |
        前端：`src/api/face.ts → uploadFace(file)`。multipart 字段名必须是 `file`。

        硬约束：文件必须**正好 512 字节**，128×32 单色位图。前端已拦一道，后端必须再校验并
        返回中文 message（前端原样弹出）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 512 字节的 128×32 单色位图
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FaceItem' }
              example:
                code: 0
                message: ok
                data: { id: 101, name: 我的狗, builtin: false, preview: /api/faces/101/preview }
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40002, message: 业务校验失败，message 直接展示给用户 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/faces/current:
    post:
      tags: [表情]
      summary: 切换当前表情
      description: |
        前端：`src/api/face.ts → setCurrentFace()`。

        **这是切表情的唯一入口**，不要设计成走 `/api/commands/send` 带 action 字段。
        后端收到后下发串口 0x07，并推 WS `state` 事件（face 字段变化）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [face]
              properties:
                face: { type: integer, description: 已存在的表情 id, example: 3 }
      responses:
        '200':
          description: 已切换
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          face: { type: integer, example: 3 }
              example:
                code: 0
                message: ok
                data: { face: 3 }
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40400, message: 资源不存在 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/faces/{id}:
    delete:
      tags: [表情]
      summary: 删除自定义表情
      description: 前端：`src/api/face.ts → deleteFace()`。内置表情不可删。
      parameters:
        - name: id
          in: path
          required: true
          description: 表情 id
          schema: { type: integer, example: 101 }
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OkResult' }
              example:
                code: 0
                message: ok
                data: { ok: true }
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40002, message: 内置表情不能删除 }
          - { code: 40400, message: 表情不存在 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/logs:
    get:
      tags: [日志与遥测]
      summary: 指令日志（分页）
      description: |
        前端：`src/api/log.ts → listLogs()`。日志页分页 + 双过滤；看板固定 `size=200` 拉一次算成功率。

        - 按 `time` 倒序（最新在最前）。
        - `total` 是过滤后的总数，不是当前页条数。
        - `status` 选「全部」时前端**不传这个参数**，后端要当可选。
        - `size=200` 必须支持，别写死上限 100。
        - `action_name` 由后端存中文名，缺失时前端显示「未知动作 0x33」。
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始；不传取 1
          schema: { type: integer, minimum: 1, default: 1, example: 1 }
        - name: size
          in: query
          required: false
          description: 每页条数，日志页 10/20/50，看板 200；不传取 20，上限 200
          schema: { type: integer, minimum: 1, maximum: 200, default: 20, example: 10 }
        - name: status
          in: query
          required: false
          description: 按状态过滤；不传表示全部
          schema:
            type: string
            enum: [OK, TIMEOUT, ERROR, PENDING]
        - name: device_id
          in: query
          required: false
          description: 按设备过滤；不传表示全部
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PageResult' }
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: 1024
                      device_id: 1
                      time: '2026-11-08T15:29:41+08:00'
                      action: 51
                      action_name: 前进
                      status: OK
                      cost_ms: 312
                      seq: 17
                      response: 0x81 受理 / 0x02 完成
                  total: 57
                  page: 1
                  size: 10
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/telemetry:
    get:
      tags: [日志与遥测]
      summary: 近 24 小时电量遥测
      description: |
        前端：`src/api/telemetry.ts → listTelemetry()`，看板电量曲线。

        - **按时间升序**（最旧 → 最新），顺序反了曲线就是倒着走的。
        - 默认最近 24 小时、每小时 1 条，共 24 条（前端不传 `minutes`，走默认值）。
        - 少于 2 条前端画出来是空白，库里没数据时最好也返回当前值。
      parameters:
        - name: minutes
          in: query
          required: false
          description: 回溯分钟数，可选；不传取 1440（24 小时）
          schema: { type: integer, minimum: 1, maximum: 1440, default: 1440, example: 1440 }
      responses:
        '200':
          description: 遥测点数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TelemetryPoint' }
              example:
                code: 0
                message: ok
                data:
                  - { time: '2026-11-07T16:00:00+08:00', battery: 84, voltage: 4.06 }
                  - { time: '2026-11-07T17:00:00+08:00', battery: 82, voltage: 4.05 }
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/weather:
    get:
      tags: [设备]
      summary: 当前天气
      description: |
        前端：`src/api/weather.ts → getWeather()`，进监控台拉一次，之后靠 WS `weather` 事件更新。
        抓取失败建议返回上一次缓存 + `code: 9`（未知），不要返回 500。
      responses:
        '200':
          description: 天气
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WeatherInfo' }
              example:
                code: 0
                message: ok
                data: { code: 0, text: 晴, temp: 23, updated_at: '2026-11-08T15:30:00+08:00' }
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/scenes:
    get:
      tags: [场景]
      summary: 场景列表
      description: 前端：`src/api/scene.ts → listScenes()`。数组，不翻页。
      responses:
        '200':
          description: 场景数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Scene' }
              example:
                code: 0
                message: ok
                data:
                  - id: 1
                    name: 早上好
                    description: 起床三连，适合演示开场
                    steps: [{ action: 49 }, { action: 67 }, { action: 64 }]
                    updated_at: '2026-11-08T15:00:00+08:00'
                timestamp: 1762587000000
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [场景]
      summary: 新建场景
      description: 前端：`src/api/scene.ts → createScene()`。响应必须带真实 id。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SceneInput' }
      responses:
        '200':
          description: 新建的场景
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Scene' }
              example:
                code: 0
                message: ok
                data:
                  id: 10
                  name: 巡游
                  description: 走两步转个身
                  steps: [{ action: 51 }, { action: 53 }]
                  updated_at: '2026-11-08T15:30:00+08:00'
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40002, message: 业务校验失败，message 直接展示给用户 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/scenes/{id}:
    put:
      tags: [场景]
      summary: 修改场景
      description: |
        前端：`src/api/scene.ts → updateScene()`。前端每次全量传 name/description/steps，
        `steps` 是全量替换——后端要先删旧步骤再插新的，不要增量追加。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SceneUpdate' }
      responses:
        '200':
          description: 更新后的场景
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Scene' }
              example:
                code: 0
                message: ok
                data:
                  id: 1
                  name: 巡游
                  description: ''
                  steps: [{ action: 51 }]
                  updated_at: '2026-11-08T15:31:00+08:00'
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40400, message: 资源不存在 }
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [场景]
      summary: 删除场景
      description: 前端：`src/api/scene.ts → deleteScene()`（页面先弹确认框）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OkResult' }
              example:
                code: 0
                message: ok
                data: { ok: true }
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40400, message: 资源不存在 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/scenes/{id}/run:
    post:
      tags: [场景]
      summary: 执行场景
      description: |
        前端：`src/api/scene.ts → runScene()`。

        **必须立刻返回**，不要等整个场景跑完（三步 × 0.9 秒就接近前端 10 秒超时的一半）。
        后台用 `asyncio.create_task` 逐步下发，每步推 WS `state` 事件。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: 已开始执行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          steps: { type: integer, description: 本场景步数, example: 3 }
              example:
                code: 0
                message: ok
                data: { steps: 3 }
                timestamp: 1762587000000
        default:
          $ref: '#/components/responses/BusinessError'
        x-business-errors:
          - { code: 40400, message: 资源不存在 }
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      description: 设备 id
      schema: { type: integer, example: 1 }

  responses:
    BusinessError:
      description: 业务失败（HTTP 200 + 非 0 code，前端直接弹 message）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
          example:
            code: 40002
            message: 动作码不合法
            data: null
            timestamp: 1762587000000
    Unauthorized:
      description: 登录态失效（必须是 HTTP 401，前端据此清登录态跳登录页）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
          example:
            code: 40101
            message: 登录已过期，请重新登录
            data: null
            timestamp: 1762587000000

  schemas:
    ApiResponse:
      type: object
      description: 统一返回外壳。code=0 成功；非 0 时前端弹出 message。
      required: [code, message, data, timestamp]
      properties:
        code:
          type: integer
          description: 0 成功，非 0 见错误码表
          example: 0
        message:
          type: string
          description: 中文、可直接展示给用户
          example: ok
        data:
          description: 业务数据，无数据时给 null 或 {}
          nullable: true
        timestamp:
          type: integer
          format: int64
          description: 毫秒时间戳
          example: 1762587000000

    User:
      type: object
      required: [username, name, role]
      properties:
        username: { type: string, example: admin }
        name: { type: string, description: 显示名, example: 管理员 }
        role:
          type: string
          enum: [user, admin]
          description: 只有这两个值；前端只展示不校验。缺省 user
          example: admin

    LoginResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT，前端存 localStorage 并加 `Bearer ` 前缀
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        user: { $ref: '#/components/schemas/User' }

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z0-9_\u4e00-\u9fa5]+$'
          description: 3–20 位字母、数字、下划线或中文；前端会先 trim
          example: tester01
        password:
          type: string
          minLength: 6
          description: 至少 6 位；后端存哈希，不要明文落库
          example: secret123

    RegisterResult:
      type: object
      required: [username, name]
      properties:
        username: { type: string, example: tester01 }
        name: { type: string, description: 显示名，默认等于 username, example: tester01 }

    Device:
      type: object
      required: [id, name, online, firmware, last_heartbeat, battery]
      properties:
        id: { type: integer, description: 必须存在 id=1（前端默认选它）, example: 1 }
        name: { type: string, example: 桌宠一号 · 小灰 }
        online: { type: boolean, description: 后端按心跳 < 30 秒判定, example: true }
        firmware: { type: string, example: v2.0.0 }
        last_heartbeat:
          type: string
          description: ISO 8601 带时区
          example: '2026-11-08T15:29:52+08:00'
        battery: { type: integer, minimum: 0, maximum: 100, example: 78 }
        location: { type: string, description: 可选, example: 书桌 }

    DeviceRename:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 20
          description: 新的桌宠显示名，前后端都会 trim
          example: 小灰灰

    DeviceStatus:
      type: object
      required:
        - device_id
        - battery
        - voltage
        - action
        - face
        - music_state
        - track
        - volume
        - weather_code
        - temp
        - updated_at
      properties:
        device_id: { type: integer, example: 1 }
        battery: { type: integer, minimum: 0, maximum: 100, example: 78 }
        voltage: { type: number, format: float, description: 伏，两位小数, example: 3.92 }
        action: { type: integer, description: 当前动作码，十进制, example: 49 }
        face: { type: integer, description: 当前表情 0-6, example: 0 }
        music_state: { type: integer, enum: [0, 1, 2], description: 0 停止 / 1 播放 / 2 暂停, example: 0 }
        track: { type: integer, description: 曲目号，1 起, example: 3 }
        volume: { type: integer, minimum: 0, maximum: 30, example: 15 }
        weather_code: { type: integer, minimum: 0, maximum: 9, example: 0 }
        temp: { type: integer, description: 摄氏度，可负, example: 23 }
        updated_at: { type: string, example: '2026-11-08T15:30:00+08:00' }

    CommandRequest:
      type: object
      required: [action]
      properties:
        action:
          type: integer
          description: 动作码，十进制。19 个合法值见契约文档 5.1 节
          enum:
            - 41   # 0x29 放松趴下
            - 48   # 0x30 蹲下
            - 49   # 0x31 站立
            - 50   # 0x32 趴下
            - 51   # 0x33 前进
            - 52   # 0x34 后退
            - 56   # 0x38 提速
            - 65   # 0x41 前跳
            - 66   # 0x42 后跳
            - 72   # 0x48 伸懒腰
            - 73   # 0x49 后腿拉伸
            - 53   # 0x35 左转
            - 54   # 0x36 右转
            - 55   # 0x37 摇摆
            - 57   # 0x39 摇摆加速
            - 64   # 0x40 摇尾巴
            - 67   # 0x43 打招呼
            - 68   # 0x44 开灯
            - 69   # 0x45 关灯
          example: 51

    CommandStatus:
      type: string
      enum: [pending, accepted, done, rejected, unknown, superseded]
      description: |
        命令生命周期状态，**只由后端判定**，前端只显示不判定（前端不得自判超时）。
        - pending：已受理，尚未写串口
        - accepted：设备回了 0x81 受理应答
        - done：设备回了 0x02 完成应答
        - rejected：设备回了 0x05，或串口写入失败
        - unknown：超过 `T_ACK_MS`（600ms）没等到 0x81，最终判定失败
        - superseded：新命令已被受理，这条旧命令作废
      example: pending

    TransportStatus:
      type: string
      enum: [ok, write_failed, partial_write]
      description: |
        串口传输层的发送结果，后端内部字段，前端不需要展示。
        - ok：整帧写完
        - write_failed：一字节都没写出去
        - partial_write：只写出一部分（串口异常断开），按失败处理
      example: ok

    CommandAccepted:
      type: object
      required: [cmd_id, seq, action, accepted, status, transport]
      properties:
        cmd_id:
          type: string
          format: uuid
          description: |
            命令主键，后端生成，受理即返回。前端存进 pending 表；
            断线重连后用 `GET /api/commands/{id}` 对账。
          example: 6f1f2c1e-8d1a-4c3b-9e77-0a1b2c3d4e5f
        seq:
          type: integer
          minimum: 1
          maximum: 255
          description: |
            串口序号，1-255 循环（0 保留），需回填到串口帧并原样出现在 WS `ack` 里。
            前端用它做 ack 配对键，**不得用它做命令主键**（1 字节会回绕）。
          example: 17
        action: { type: integer, description: 十进制动作码, example: 51 }
        accepted:
          type: boolean
          description: 是否已受理并落库。true = 已受理，后续结果看 WS ack 与 command_log
          example: true
        status: { $ref: '#/components/schemas/CommandStatus' }
        transport: { $ref: '#/components/schemas/TransportStatus' }

    CommandReceipt:
      type: object
      description: |
        命令的完整回执，`GET /api/commands/{id}` 返回它，断线重连对账用。
        前端只在重连后对本地仍为 pending 的命令查一次，不要轮询。
      required: [cmd_id, device_id, action, status, transport, created_at, updated_at]
      properties:
        cmd_id: { type: string, format: uuid, example: 6f1f2c1e-8d1a-4c3b-9e77-0a1b2c3d4e5f }
        device_id: { type: integer, example: 1 }
        action: { type: integer, description: 十进制动作码, example: 51 }
        seq:
          type: integer
          nullable: true
          minimum: 1
          maximum: 255
          description: 后端分配的串口序号；写串口就失败时可能为 null
          example: 17
        status: { $ref: '#/components/schemas/CommandStatus' }
        transport: { $ref: '#/components/schemas/TransportStatus' }
        error_code:
          type: integer
          nullable: true
          description: 仅 status=rejected 时非 null，取值见 error-codes.md 的设备错误码 0x05 DATA[0]
          example: null
        created_at: { type: string, format: date-time, example: '2026-11-08T15:29:41+08:00' }
        updated_at: { type: string, format: date-time, example: '2026-11-08T15:29:41.312+08:00' }
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: 进入终态（done/rejected/unknown/superseded）的时刻，未终结时为 null
          example: '2026-11-08T15:29:41.312+08:00'

    WsTicket:
      type: object
      required: [ticket, expires_in_sec]
      properties:
        ticket:
          type: string
          description: 一次性票据，30 秒有效，绑定 (user_id, device_id)，验过即从票据池删除
          example: 3f7c9a2e5b1d4c8f
        expires_in_sec:
          type: integer
          description: 有效期秒数，固定 30
          example: 30

    MusicRequest:
      type: object
      required: [command]
      properties:
        command:
          type: integer
          enum: [0, 1, 2, 3, 4, 5]
          description: 0 停止 / 1 播放 / 2 暂停 / 3 下一首 / 4 上一首 / 5 设音量
          example: 5
        value:
          type: integer
          minimum: 0
          maximum: 30
          description: 仅 command=5 有效，其它情况前端传 0
          default: 0
          example: 20

    MusicResult:
      type: object
      description: 前端不读这个响应，音乐状态以 WS `music` 事件为准
      properties:
        ok: { type: boolean, example: true }
        state: { type: integer, enum: [0, 1, 2], example: 1 }
        track: { type: integer, example: 3 }
        volume: { type: integer, minimum: 0, maximum: 30, example: 20 }

    FaceItem:
      type: object
      required: [id, name, builtin]
      properties:
        id: { type: integer, description: 0-6 内置，自定义从 100 起, example: 0 }
        name: { type: string, example: 普通 }
        builtin: { type: boolean, description: true 的不可删, example: true }
        preview:
          type: string
          description: |
            可选，图片 URL 或 data URI；内置表情前端自己画 SVG，会忽略此字段。
            如果是 URL，必须是浏览器 <img> 能直接 GET 的地址（不能要求 Authorization 头），
            例如 /api/faces/101/preview；否则自定义表情会裂图。
          example: /api/faces/101/preview

    CommandLog:
      type: object
      required: [id, device_id, time, action, action_name, status, cost_ms, seq, response]
      properties:
        id: { type: integer, example: 1024 }
        device_id: { type: integer, example: 1 }
        time: { type: string, description: 下发时间，ISO 带时区, example: '2026-11-08T15:29:41+08:00' }
        action: { type: integer, example: 51 }
        action_name: { type: string, description: 动作中文名，由后端存, example: 前进 }
        status:
          type: string
          enum: [OK, TIMEOUT, ERROR, PENDING]
          description: 四个值固定大写，前端据此上色
          example: OK
        cost_ms: { type: integer, description: 下发到应答的毫秒数；TIMEOUT 给 T_ACK_MS（600）左右；PENDING 给 0, example: 312 }
        seq: { type: integer, example: 17 }
        response: { type: string, description: 原始应答摘要，给人看, example: 0x81 受理 / 0x02 完成 }

    PageResult:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CommandLog' }
        total: { type: integer, description: 过滤后的总数，不是当前页条数, example: 57 }
        page: { type: integer, example: 1 }
        size: { type: integer, example: 10 }

    TelemetryPoint:
      type: object
      required: [time, battery, voltage]
      properties:
        time: { type: string, description: ISO 带时区，数组需按时间升序, example: '2026-11-07T16:00:00+08:00' }
        battery: { type: integer, minimum: 0, maximum: 100, example: 84 }
        voltage: { type: number, format: float, example: 4.06 }

    WeatherInfo:
      type: object
      required: [code, text, temp, updated_at]
      properties:
        code: { type: integer, minimum: 0, maximum: 9, description: 前端按此码选图标，0 晴 / 1 多云 / 2 阴 / 3 小雨 / 4 中雨 / 5 大雨 / 6 雷阵雨 / 7 雪 / 8 雾 / 9 未知, example: 0 }
        text: { type: string, description: 中文描述，兜底用, example: 晴 }
        temp: { type: integer, description: 摄氏度，可负, example: 23 }
        updated_at: { type: string, example: '2026-11-08T15:30:00+08:00' }
        location:
          type: string
          description: 可选，展示地点；不返回时前端兜底「湘潭 · 雨湖区」
          example: 湘潭 · 雨湖区
        source:
          type: string
          description: 可选，数据源名称，仅用于页面提示
          example: Open-Meteo

    OkResult:
      type: object
      description: 删除类接口的返回值，前端不读内容只看成功
      required: [ok]
      properties:
        ok: { type: boolean, example: true }

    SceneStep:
      type: object
      required: [action]
      description: 只有 action，没有延时/循环字段（节奏由后端定）
      properties:
        action: { type: integer, example: 51 }

    Scene:
      type: object
      required: [id, name, description, steps, updated_at]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: 早上好 }
        description: { type: string, description: 可为空字符串，不要 null, example: 起床三连 }
        steps:
          type: array
          items: { $ref: '#/components/schemas/SceneStep' }
        updated_at: { type: string, example: '2026-11-08T15:00:00+08:00' }

    SceneInput:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, minLength: 1, maxLength: 20, example: 巡游 }
        description: { type: string, default: '', example: 走两步转个身 }
        steps:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SceneStep' }

    SceneUpdate:
      type: object
      description: 字段全可选，但前端每次都全量传 name/description/steps（全量覆盖）
      properties:
        name: { type: string, minLength: 1, maxLength: 20, example: 巡游 }
        description: { type: string, example: '' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/SceneStep' }
