[pytest]
# 让 pytest 把 backend/ 当成 import 的起点，这样 `from app.xxx import ...` 才找得到
# 不加这一行的话，只在 backend 目录下用 `python -m pytest` 才碰巧能用
pythonpath = .

# 不带参数敲 pytest 时，只跑 tests/ 目录
testpaths = tests

# pytest-asyncio：BA05 的 WebSocket 测试要写 async 用例，先定死作用域
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
